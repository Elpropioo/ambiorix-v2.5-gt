
name: Build Ambiorix Pay APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Encontrar proyecto Android
        id: project
        shell: bash
        run: |
          PROJECT_DIR=""

          while IFS= read -r file; do
            DIR="$(dirname "$file")"
            if [ -f "$DIR/gradlew" ]; then
              PROJECT_DIR="$DIR"
              break
            fi
          done < <(find . -type f \( \
            -name settings.gradle -o \
            -name settings.gradle.kts \
          \) -not -path '*/.gradle/*' | sort)

          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::No se encontró settings.gradle junto con gradlew."
            exit 1
          fi

          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Proyecto: $PROJECT_DIR"

      - name: Diagnosticar Java y Gradle
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          java -version
          echo "Versión del wrapper:"
          grep '^distributionUrl=' gradle/wrapper/gradle-wrapper.properties
          echo "Versión de Java del wrapper:"
          ./gradlew --version

      - name: Compilar APK
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        env:
          JAVA_OPTS: ""
          GRADLE_OPTS: ""
          JDK_JAVA_OPTIONS: ""
          JAVA_TOOL_OPTIONS: ""
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: AmbiorixPay-debug-apk
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
