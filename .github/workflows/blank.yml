
      - name: Dar permisos al Gradle Wrapper
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          chmod +x ./gradlew
          sed -i 's/\r$//' ./gradlew

      - name: Diagnosticar Java y Gradle
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          java -version
          echo "Versión del wrapper:"
          grep '^distributionUrl=' gradle/wrapper/gradle-wrapper.properties
          echo "Versión de Gradle:"
          ./gradlew --version

      - name: Compilar APK
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        env:
          JAVA_OPTS: ""
          GRADLE_OPTS: ""
          JDK_JAVA_OPTIONS: ""
          JAVA_TOOL_OPTIONS: ""
        run: |
          ./gradlew assembleDebug
